<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <g transform="translate(60 0)">

  <!-- mark: a long document folding into a fan of swipe cards -->
  <g transform="translate(265 200)">
    <!-- source document -->
    <rect x="-196" y="-86" width="108" height="146" rx="14"
          fill="none" stroke="url(#mark)" stroke-width="13"/>
    <line x1="-172" y1="-48" x2="-112" y2="-48" stroke="#4C1D95" stroke-width="11" stroke-linecap="round"/>
    <line x1="-172" y1="-12" x2="-112" y2="-12" stroke="#6D28D9" stroke-width="11" stroke-linecap="round" stroke-opacity="0.72"/>
    <line x1="-172" y1="24" x2="-132" y2="24" stroke="#A78BFA" stroke-width="11" stroke-linecap="round" stroke-opacity="0.6"/>
    <!-- morph arrow -->
    <path d="M -56 0 C -18 0 -8 0 30 0" fill="none" stroke="url(#mark)" stroke-width="13" stroke-linecap="round"/>
    <path d="M 14 -20 L 44 0 L 14 20 Z" fill="#A78BFA"/>
    <!-- card stack -->
    <g transform="translate(150 0)">
      <rect x="-52" y="-72" width="104" height="140" rx="16" transform="rotate(-11)"
            fill="none" stroke="url(#mark)" stroke-width="12" stroke-opacity="0.55"/>
      <rect x="-52" y="-72" width="104" height="140" rx="16" transform="rotate(9) translate(6 -4)"
            fill="none" stroke="url(#mark)" stroke-width="12" stroke-opacity="0.8"/>
      <rect x="-52" y="-72" width="104" height="140" rx="16" transform="translate(2 -8)"
            fill="#F5F3FF" stroke="url(#mark)" stroke-width="13"/>
      <line x1="-30" y1="-42" x2="30" y2="-42" stroke="#4C1D95" stroke-width="10" stroke-linecap="round"/>
      <line x1="-30" y1="-14" x2="16" y2="-14" stroke="#6D28D9" stroke-width="10" stroke-linecap="round" stroke-opacity="0.65"/>
    </g>
  </g>

  <line x1="520" y1="110" x2="520" y2="290" stroke="#6D28D9" stroke-opacity="0.4" stroke-width="4" stroke-linecap="round"/>

  <text x="585" y="222" font-family="'Helvetica Neue', 'SF Pro Display', Arial, sans-serif"
        font-weight="700" font-size="148" letter-spacing="-5" fill="#3B0764">post<tspan fill="url(#word)">deck</tspan></text>
  <text x="591" y="292" font-family="'Helvetica Neue', 'PingFang SC', 'SF Pro Display', Arial, sans-serif"
        font-weight="500" font-size="44" letter-spacing="1" fill="#6D28D9">长文拆成卡片，先审完再公开</text>
  </g>
</svg>
